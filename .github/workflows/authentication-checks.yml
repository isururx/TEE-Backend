name: Authentication Foundation Checks
on:
  push:
    branches: [feature/authentication-foundation]
  pull_request:
    branches: [main, Ishara-Tharushi]
jobs:
  backend-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security test dependencies
        run: python -m pip install pytest python-jose python-dotenv argon2-cffi
      - name: Run authentication security tests
        run: python -m pytest tests/test_auth_security.py -q
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: isururx/TEE
          ref: feature/authentication-foundation
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend/Tee
        run: npm ci
      - name: Build frontend
        working-directory: frontend/Tee
        run: npm run build
